<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Hypercube</title>
  <link rel="stylesheet" href="second.css">
</head>
<body>
  <p id="load-msg">loading…</p>
  <script>
    window.addEventListener("unhandledrejection", function () {
      var el = document.getElementById("load-msg");
      if (el && !document.body.classList.contains("is-ready")) {
        el.textContent = "Не удалось загрузить 3D. Обнови страницу.";
      }
    });
  </script>
  <script type="module" src="second.js"></script>
</body>
</html>
